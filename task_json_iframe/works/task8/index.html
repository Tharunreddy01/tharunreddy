<html>
    <body>
        <input placeholder="ENTER THE POSITIVE NUMBER HERE" id = "input" onkeyup="grade_update()"/>
        <div id = "stars"></div>
        <script>
            function grade_update(){
                let text="";
                let n = parseFloat(document.getElementById("input").value);
                for (let i=0; i<=n; i++){
                    for (let j=0; j<i; j++){
                        text += "* ";
                    }
                    text += "<br>";
                }

                document.getElementById('stars').innerHTML = text;
            }
        </script>
    </body>
</html>
